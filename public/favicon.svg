<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mesmo par de cores do quadrado da marca na landing (.landing-nav-icon):
       fundo = cor accent, letra = cor bg-app, valores de cada tema. Favicon
       não lê variável CSS do app (é um arquivo estático, carregado antes de
       qualquer JS), então os hexadecimais ficam fixos aqui - só respondem ao
       tema do SISTEMA operacional (prefers-color-scheme), não ao seletor de
       tema manual do app/landing. -->
  <style>
    .fv-bg { fill: #3d3d46; }
    .fv-fg { fill: #dee2e8; }
    @media (prefers-color-scheme: dark) {
      .fv-bg { fill: #e5e5e5; }
      .fv-fg { fill: #050505; }
    }
  </style>
  <rect class="fv-bg" width="32" height="32" rx="7" />
  <text
    class="fv-fg"
    x="16"
    y="23"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="20"
  >X</text>
</svg>
