<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xaphires</title>
  <meta
    name="description"
    content="O Xaphires é a plataforma que reúne Vendas & CRM, Financeiro e outros módulos da empresa em um só lugar, sem planilhas soltas nem ferramentas separadas."
  />
  <link rel="canonical" href="https://xaphires.com/" />
  <!-- Alternativas de idioma da raiz do site - src/i18n/seo.js recria este
       mesmo bloco em runtime (removendo e regravando os data-hreflang-alt)
       sempre que o idioma muda ou a URL carrega com prefixo (/en, /es...),
       porque o canonical/og:url mudam junto. Este bloco estático aqui é só
       o retrato inicial (pt, raiz) para quem lê o HTML sem executar JS. -->
  <link rel="alternate" hreflang="pt-BR" href="https://xaphires.com/" data-hreflang-alt="1" />
  <link rel="alternate" hreflang="en-US" href="https://xaphires.com/en" data-hreflang-alt="1" />
  <link rel="alternate" hreflang="es-ES" href="https://xaphires.com/es" data-hreflang-alt="1" />
  <link rel="alternate" hreflang="fr-FR" href="https://xaphires.com/fr" data-hreflang-alt="1" />
  <link rel="alternate" hreflang="de-DE" href="https://xaphires.com/de" data-hreflang-alt="1" />
  <link rel="alternate" hreflang="x-default" href="https://xaphires.com/" data-hreflang-alt="1" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Xaphires" />
  <meta property="og:title" content="Xaphires" />
  <meta
    property="og:description"
    content="O Xaphires é a plataforma que reúne Vendas & CRM, Financeiro e outros módulos da empresa em um só lugar, sem planilhas soltas nem ferramentas separadas."
  />
  <meta property="og:url" content="https://xaphires.com/" />
  <meta property="og:image" content="https://xaphires.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="570" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Playfair Display entra só para o logotipo "Xaphires"; a interface segue na Inter.
       Geist/Geist Mono são só para o título e o rótulo do hero escuro da Home
       (landing-hero-dark) - fonte do Vercel, aberta (OFL), sem problema de
       licença. Todas as famílias vão na mesma requisição para não abrir uma
       conexão a mais. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500..800&family=Inter:wght@400;500;600;700;800;900&family=Geist:wght@700;800;900&family=Geist+Mono:wght@500;600&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
